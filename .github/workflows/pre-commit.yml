name: Pre-Commit

on:
  workflow_call:
    inputs:
      trivy_scan_ref:
        description: "Path Trivy scans in the terraform_trivy job. Narrow to e.g. 'terraform' to skip app dependency/Dockerfile scanning."
        type: string
        required: false
        default: "."

env:
  PY_VERSION: "3.x"
  # Pinned to 1.23.x, not "^1.23.0": on newer Go the runner resolves to 1.26.x,
  # where gitleaks' vendored go-re2 wazero runtime panics with
  # "wasm error: invalid table access" while compiling its config regexes.
  GO_VERSION: "~1.23.0"

jobs:
  terraform_fmt:
    name: terraform_fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Checkout precommit config
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: StratusGrid/workflow-config
          path: workflow-config
      - name: Install Python ${{ env.PY_VERSION }}.X
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Install TFenv
        run: |
          git clone --depth=1 https://github.com/tfutils/tfenv.git ~/.tfenv
          ln -sfn ~/.tfenv/bin/* /usr/local/bin
          tfenv install
          tfenv use
      - name: Install pre-commit dependencies
        run: |
          pip install pre-commit
      - name: Copy precommit config
        run: |
          cp -r -n workflow-config/precommit-config/. -t $GITHUB_WORKSPACE
      - name: Execute pre-commit
        run: |
          pre-commit run terraform_fmt --color=always --show-diff-on-failure --all-files

  terraform_tflint:
    name: terraform_tflint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Checkout precommit config
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: StratusGrid/workflow-config
          path: workflow-config
      - name: Install Python ${{ env.PY_VERSION }}.X
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Install pre-commit dependencies
        run: |
          pip install pre-commit
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      - name: Copy precommit config
        run: |
          cp -r -n workflow-config/precommit-config/. -t $GITHUB_WORKSPACE
      - name: Execute pre-commit
        run: pre-commit run terraform_tflint --color=always --show-diff-on-failure --all-files

  terraform_docs:
    name: terraform_docs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Check terraform docs
        uses: terraform-docs/gh-actions@main
        with:
          working-dir: .
          config-file: .config/.terraform-docs.yml
          git-push: "false"
          fail-on-diff: "true"

  check-yaml:
    name: check-yaml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Checkout precommit config
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: StratusGrid/workflow-config
          path: workflow-config
      - name: Install Python ${{ env.PY_VERSION }}.X
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Install pre-commit dependencies
        run: |
          pip install pre-commit
      - name: Copy precommit config
        run: |
          cp -r -n workflow-config/precommit-config/. -t $GITHUB_WORKSPACE
      - name: Execute pre-commit
        run: pre-commit run check-yaml --color=always --show-diff-on-failure --all-files

  terraform_validate:
    name: terraform_validate
    runs-on: ubuntu-24.04
    needs:
      [terraform_fmt, check-yaml, terraform_tflint, terraform_docs]
    steps:
      # terraform_validate runs `terraform init` in every module directory, and each
      # one downloads its own copy of the provider plugins (the aws provider alone is
      # ~700 MB unpacked). On repos with many modules this exhausts the runner's ~14 GB
      # disk ("no space left on device"). Reclaim space by removing preinstalled
      # toolchains this job never uses. Purely additive: a no-op for small repos.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Checkout precommit config
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: StratusGrid/workflow-config
          path: workflow-config
      - name: Check if GitHub App is provided
        id: check-github-app
        if: "${{ env.TF_AUTOMATION_APP_ID != '' }}"
        run: echo "{name}={value}" >> $GITHUB_OUTPUT
        env:
          TF_AUTOMATION_APP_ID: ${{ secrets.TF_AUTOMATION_APP_ID }}
      - name: Terraform Automation get install token
        if: steps.check-github-app.outputs.defined == 'true'
        id: get-token
        # Action is pined to SHA to use thrid party action as recommended by GitHub:
        # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
        uses: getsentry/action-github-app-token@d4b5da6c5e37703f8c3b3e43abb5705b46e159cc # v3.0.0
        with:
          app_id: ${{ secrets.TF_AUTOMATION_APP_ID }}
          private_key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
      - name: Config git
        if: steps.check-github-app.outputs.defined == 'true'
        run: |
          git config --global url."https://x-access-token:${{ steps.get-token.outputs.token }}@github.com".insteadOf "https://github.com"
      - name: Install Python ${{ env.PY_VERSION }}.X
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Install TFenv
        run: |
          git clone --depth=1 https://github.com/tfutils/tfenv.git ~/.tfenv
          ln -sfn ~/.tfenv/bin/* /usr/local/bin
          tfenv install
          tfenv use
      - name: Install pre-commit dependencies
        run: |
          pip install pre-commit
      - name: Copy precommit config
        run: |
          cp -r -n workflow-config/precommit-config/. -t $GITHUB_WORKSPACE
      - name: Execute pre-commit
        run: pre-commit run terraform_validate --color=always --show-diff-on-failure --all-files

  terraform_trivy:
    name: terraform_trivy
    runs-on: ubuntu-24.04
    needs: terraform_validate
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Run Trivy vulnerability scanner in IaC mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: ${{ inputs.trivy_scan_ref }}
          hide-progress: false
          exit-code: "1"
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
          skip-dirs: ".terraform/*"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    needs: terraform_validate
    steps:
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Checkout precommit config
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: StratusGrid/workflow-config
          path: workflow-config
      - name: Install Python ${{ env.PY_VERSION }}.X
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Install pre-commit dependencies
        run: |
          pip install pre-commit
      - name: Copy precommit config
        run: |
          cp -r -n workflow-config/precommit-config/. -t $GITHUB_WORKSPACE
      - name: Execute pre-commit
        run: pre-commit run gitleaks --color=always --show-diff-on-failure --all-files
